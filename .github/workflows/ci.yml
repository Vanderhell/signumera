name: signumera-ci
on:
  push:
  pull_request:
jobs:
  gcc-clang:
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        sanitizer: [none, address, undefined]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          if [ "${{ matrix.sanitizer }}" = none ]; then
            cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=Release
          else
            cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}"
          fi
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
  msvc:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config ${{ matrix.configuration }} --parallel
      - run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure
